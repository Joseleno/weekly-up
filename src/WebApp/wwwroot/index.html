<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeeklyUp</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <!-- WeeklyUp.WebApp.styles.css gerado automaticamente pelo build quando há CSS isolation -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WeeklyUp" />
    <meta name="theme-color" content="#1E88E5" />
    <meta name="description" content="Relatórios semanais automáticos para pequenos negócios" />
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="app-loading-spinner"></div>
            <p class="app-loading-text">Carregando WeeklyUp...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Um erro inesperado ocorreu.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">Fechar</a>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/Blazor-ApexCharts/js/blazor-apexcharts.js" type="module"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.error('Service worker registration failed:', err);
    });</script>
</body>

</html>
