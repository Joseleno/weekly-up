name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore WeeklyUp.slnx

      - name: Build
        run: dotnet build WeeklyUp.slnx --no-restore --configuration Release

      - name: Rodar testes
        run: dotnet test WeeklyUp.slnx --no-build --configuration Release
